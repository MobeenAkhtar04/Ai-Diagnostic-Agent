global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: shop_api
    static_configs: [{targets: ["shop_api:8080"]}]
  - job_name: payment_stub
    static_configs: [{targets: ["payment_stub:8081"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:8082"]}]
  - job_name: stack_exporter
    static_configs: [{targets: ["stack_exporter:9200"]}]
